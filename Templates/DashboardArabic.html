<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المبيعات -Electrical POS</title>
    
    <!-- Google Fonts - Cairo for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }
        
        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            color: #a0a0a0;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
        }
        
        .stat-card .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #00d9ff;
            margin-bottom: 5px;
        }
        
        .stat-card .label {
            font-size: 1rem;
            color: #a0a0a0;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .chart-card h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 217, 255, 0.3);
        }
        
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
        
        /* Pie chart container */
        .pie-chart-container {
            height: 400px;
        }
        
        /* Bar chart container */
        .bar-chart-container {
            height: 400px;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #00d9ff;
            font-size: 1.2rem;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <h1>لوحة تحكم المبيعات</h1>
            <p>نظرة عامة على أداء المتجر电气 POS</p>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="icon">💰</div>
                <div class="value" id="totalSales">0</div>
                <div class="label">إجمالي المبيعات</div>
            </div>
            <div class="stat-card">
                <div class="icon">📦</div>
                <div class="value" id="totalOrders">0</div>
                <div class="label">عدد الفواتير</div>
            </div>
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="value" id="totalCustomers">0</div>
                <div class="label">العملاء</div>
            </div>
            <div class="stat-card">
                <div class="icon">📈</div>
                <div class="value" id="avgOrder">0</div>
                <div class="label">متوسط الفاتورة</div>
            </div>
        </div>
        
        <!-- Charts Grid -->
        <div class="charts-grid">
            <!-- Pie Chart - Sales by Category -->
            <div class="chart-card">
                <h3>المبيعات حسب الفئة</h3>
                <div class="chart-container pie-chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            
            <!-- Line Chart - Weekly Sales -->
            <div class="chart-card">
                <h3>المبيعات اليومية للأسبوع الحالي</h3>
                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
            
            <!-- Bar Chart - Top Products -->
            <div class="chart-card" style="grid-column: 1 / -1;">
                <h3>المنتجات الأكثر مبيعاً</h3>
                <div class="chart-container bar-chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Global chart instances
        let pieChart, lineChart, barChart;
        
        // Chart.js default configuration for RTL Arabic
        Chart.defaults.font.family = "'Cairo', 'Noto Sans Arabic', sans-serif";
        Chart.defaults.font.size = 14;
        Chart.defaults.color = '#ffffff';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(0, 0, 0, 0.8)';
        Chart.defaults.plugins.tooltip.titleFont = { size: 16, weight: 'bold' };
        Chart.defaults.plugins.tooltip.bodyFont = { size: 14 };
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        
        // Arabic colors palette
        const arabicColors = [
            '#00d9ff', // Cyan
            '#00ff88', // Green
            '#ff6b6b', // Red
            '#ffd93d', // Yellow
            '#6c5ce7', // Purple
            '#fd79a8', // Pink
            '#00cec9', // Teal
            '#fdcb6e', // Orange
        ];
        
        // Currency formatter for USD
        function formatCurrency(value) {
            return '$' + value.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        
        // Initialize all charts
        function initializeCharts() {
            // Pie Chart - Sales by Category
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: ['كابلات', 'مفاتيح', 'إنارة', 'أدوات'],
                    datasets: [{
                        data: [45000, 32000, 28000, 18000],
                        backgroundColor: arabicColors,
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                font: { size: 14, weight: '500' },
                                color: '#ffffff'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw;
                                    let label = context.label;
                                    return label + ': ' + formatCurrency(value);
                                }
                            }
                        }
                    }
                }
            });
            
            // Line Chart - Weekly Sales
            const lineCtx = document.getElementById('lineChart').getContext('2d');
            lineChart = new Chart(lineCtx, {
                type: 'line',
                data: {
                    labels: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'],
                    datasets: [{
                        label: 'المبيعات',
                        data: [12000, 19000, 15000, 22000, 18000, 25000, 28000],
                        borderColor: '#00d9ff',
                        backgroundColor: 'rgba(0, 217, 255, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#00d9ff',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                font: { size: 14, weight: '500' }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value);
                                },
                                font: { size: 12 }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'المبيعات: ' + formatCurrency(context.raw);
                                }
                            }
                        }
                    }
                }
            });
            
            // Bar Chart - Top Products
            const barCtx = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['كابل HDMI', 'مفتاح كهربائي', 'مصباح LED', 'فيش كهربائية', 'أسلاك نحاسية', 'قواطع كهربائية', 'أنابيب صرف'],
                    datasets: [{
                        label: 'المبيعات',
                        data: [8500, 7200, 6800, 5500, 4800, 4200, 3500],
                        backgroundColor: arabicColors,
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2,
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value);
                                }
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: { size: 14, weight: '500' }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'المبيعات: ' + formatCurrency(context.raw);
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Update stats function (called from C#)
        function updateStats(stats) {
            if (stats.totalSales !== undefined) {
                document.getElementById('totalSales').textContent = formatCurrency(stats.totalSales);
            }
            if (stats.monthlySales !== undefined) {
                const monthlySalesEl = document.getElementById('monthlySales');
                if (monthlySalesEl) {
                    monthlySalesEl.textContent = formatCurrency(stats.monthlySales);
                }
            }
            if (stats.totalOrders !== undefined) {
                document.getElementById('totalOrders').textContent = stats.totalOrders.toLocaleString('ar-SA');
            }
            if (stats.totalCustomers !== undefined) {
                document.getElementById('totalCustomers').textContent = stats.totalCustomers.toLocaleString('ar-SA');
            }
            if (stats.avgOrder !== undefined) {
                document.getElementById('avgOrder').textContent = formatCurrency(stats.avgOrder);
            }
            // Purchase stats
            if (stats.totalPurchases !== undefined) {
                const el = document.getElementById('totalPurchases');
                if (el) el.textContent = formatCurrency(stats.totalPurchases);
            }
            // Product stats
            if (stats.totalProducts !== undefined) {
                const el = document.getElementById('totalProducts');
                if (el) el.textContent = stats.totalProducts.toLocaleString('ar-SA');
            }
            if (stats.lowStockCount !== undefined) {
                const el = document.getElementById('lowStockCount');
                if (el) el.textContent = stats.lowStockCount.toLocaleString('ar-SA');
            }
            // Supplier stats
            if (stats.totalSuppliers !== undefined) {
                const el = document.getElementById('totalSuppliers');
                if (el) el.textContent = stats.totalSuppliers.toLocaleString('ar-SA');
            }
            // Profit stats
            if (stats.todayProfit !== undefined) {
                const el = document.getElementById('todayProfit');
                if (el) el.textContent = formatCurrency(stats.todayProfit);
            }
            if (stats.monthlyProfit !== undefined) {
                const el = document.getElementById('monthlyProfit');
                if (el) el.textContent = formatCurrency(stats.monthlyProfit);
            }
        }
        
        // Update pie chart data
        function updatePieChart(data) {
            if (pieChart && data.labels && data.values) {
                pieChart.data.labels = data.labels;
                pieChart.data.datasets[0].data = data.values;
                pieChart.update();
            }
        }
        
        // Update line chart data
        function updateLineChart(data) {
            if (lineChart && data.labels && data.values) {
                lineChart.data.labels = data.labels;
                lineChart.data.datasets[0].data = data.values;
                lineChart.update();
            }
        }
        
        // Update bar chart data
        function updateBarChart(data) {
            if (barChart && data.labels && data.values) {
                barChart.data.labels = data.labels;
                barChart.data.datasets[0].data = data.values;
                barChart.update();
            }
        }
        
        // Update fast selling chart data
        function updateFastSellingChart(data) {
            // Fast selling chart is optional - can be added if needed
            console.log('Fast selling chart data:', data);
        }
        
        // Update profit chart data
        function updateProfitChart(data) {
            // Profit chart is optional - can be added if needed
            console.log('Profit chart data:', data);
        }
        
        // Update supplier chart data
        function updateSupplierChart(data) {
            // Supplier chart is optional - can be added if needed
            console.log('Supplier chart data:', data);
        }
        
        // Receive message from C# - handles complete data object
        window.chartsReceiveMessage = function(message) {
            console.log('Received message from C#:', message);
            
            // Handle stats object
            if (message.stats) {
                updateStats(message.stats);
            }
            
            // Handle pie chart
            if (message.pieChart && message.pieChart.labels && message.pieChart.labels.length > 0) {
                updatePieChart(message.pieChart);
            }
            
            // Handle line chart
            if (message.lineChart && message.lineChart.labels && message.lineChart.labels.length > 0) {
                updateLineChart(message.lineChart);
            }
            
            // Handle bar chart
            if (message.barChart && message.barChart.labels && message.barChart.labels.length > 0) {
                updateBarChart(message.barChart);
            }
            
            // Handle fast selling chart
            if (message.fastSellingChart && message.fastSellingChart.labels) {
                updateFastSellingChart(message.fastSellingChart);
            }
            
            // Handle profit chart
            if (message.profitChart && message.profitChart.labels) {
                updateProfitChart(message.profitChart);
            }
            
            // Handle supplier chart
            if (message.supplierChart && message.supplierChart.labels) {
                updateSupplierChart(message.supplierChart);
            }
        };
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            
            // Signal to C# that charts are ready
            if (window.chartsReady) {
                window.chartsReady();
            }
        });
    </script>
</body>
</html>
